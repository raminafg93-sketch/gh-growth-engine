version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      astro-toolchain:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "sharp"
      dev-tooling:
        patterns:
          - "prettier*"
          - "typescript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
